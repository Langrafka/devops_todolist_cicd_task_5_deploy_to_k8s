name: Kind Deploy Upgrade

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: 'Environment name (e.g., development, staging)'
        type: string
      version:
        required: true
        description: 'Docker image version to deploy (e.g., ${{ github.sha }})'
        type: string
      helm-release-name:
        description: 'Name of the Helm release'
        type: string
        default: 'todoapp' # Використовуємо ім'я чарту як дефолт
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  deploy-kind:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # Використовує середовище GitHub
    name: Deploy to ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Завантажуємо Helm-пакет, створений у helm-ci
      - name: Download Helm Package
        uses: actions/download-artifact@v4
        with:
          name: helm-package
          path: .

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      # Створення кластера Kind
      - name: Create Kind Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: ${{ inputs.environment }}-cluster
          config: ./cluster.yml

      # Логін DockerHub, щоб Kind міг завантажити образ
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Завантаження образу у Kind Cluster
      - name: Load Docker Image into Kind
        run: |
          IMAGE_TAG=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DockerImageName }}:${{ inputs.version }}
          docker pull $IMAGE_TAG
          kind load docker-image $IMAGE_TAG --name ${{ inputs.environment }}-cluster

      # Helm Install --dry-run (вимоги завдання)
      - name: Helm Install Dry Run
        run: |
          helm install ${{ inputs.helm-release-name }} ./*.tgz \
          --namespace ${{ inputs.environment }} --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DockerImageName }} \
          --set image.tag=${{ inputs.version }} \
          --dry-run --debug
        env:
          # Встановіть тут ім'я образу, яке відповідає main.yml
          DockerImageName: todoapp

      # Helm Upgrade --install --atomic (вимоги завдання)
      - name: Deploy/Upgrade Helm
        run: |
          helm upgrade --install ${{ inputs.helm-release-name }} ./*.tgz \
          --namespace ${{ inputs.environment }} --create-namespace \
          --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DockerImageName }} \
          --set image.tag=${{ inputs.version }} \
          --atomic --wait --timeout 300s # --atomic забезпечує відкат
        env:
          DockerImageName: todoapp # Встановіть тут ім'я образу